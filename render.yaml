services:
  - type: web
    name: dpr-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI_BASE
        sync: false
      - key: MONGO_CENTRAL_DB
        value: dpr_control
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_ORIGIN
        sync: false
